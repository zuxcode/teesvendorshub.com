  postgres:
    image: postgres:18-alpine
    container_name: tees_postgres
    restart: unless-stopped
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    env_file:
      - path: .env.postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - tees_net
    labels:
      - "docker-volume-backup.archive-pre=/bin/sh -c 'pg_dump -U  $${POSTGRES_USER} -d $${POSTGRES_DB} -Fc -Z9 -f /var/lib/postgresql/18/docker/myforexsignature-dump-$(date +%Y-%m-%dT%H-%M-%S).dump'"
      - "docker-volume-backup.exec-label=postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

